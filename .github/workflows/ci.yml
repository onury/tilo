name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm 10.9 (bundled with Node 22) crashes resolving a lockfile-less tree (npm/cli#9787)
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run cover
